name: Daily River Plate ETL

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab

jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run ETL Script
      env:
        ENVIRONMENT: prod
        # Mapping GitHub Secrets (DB_*) to what database.py expects for PROD (SUPABASE_*)
        SUPABASE_HOST: ${{ secrets.DB_HOST }}
        # Note: Start using 'postgres' as DB name for Supabase connection pooling if needed, 
        # or just pass the secret. database.py forces 'postgres' so we might not need this one, 
        # but good to have for completeness if logic changes.
        SUPABASE_USER: ${{ secrets.DB_USER }}
        SUPABASE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        SUPABASE_PORT: ${{ secrets.DB_PORT }}
      run: |
        python run_etl.py
